<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' data: https://raw.githubusercontent.com;
                img-src 'self' data: https://raw.githubusercontent.com;
                style-src 'self' 'unsafe-inline';">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, width=device-width,
viewport-fit=cover">
    <link rel="stylesheet" href="css/index.css">
    <title>Pokédex</title>
</head>
<body>

    <!-- ヘッダー -->
    <header>
    <h1>Pokédex</h1>
    </header>

    <!-- ローディング表示 -->
    <div id="loading">
    <div class="spinner"></div>
    <p>Loading...</p>
    </div>

    <!-- エラー表示 -->
    <p id="error-message"></p>

    <!-- ポケモン一覧リスト -->
    <ul id="pokemon-list"></ul>

    <!-- 詳細ダイアログ -->
    <div id="dialog-overlay">
    <div class="dialog">

        <div class="dialog-header">
        <span id="dialog-title">Detail</span>
        <button id="dialog-close">&#x2715;</button>
        </div>

        <!-- スライダー（基本情報・ステータスをスワイプで切り替え） -->
        <div id="evolution-slider"></div>

        <div class="slider-controls">
        <button class="arrow-btn" id="prev-btn">&#8592;</button>
        <div class="slider-indicators">
            <span id="slide-counter"></span>
            <div id="slider-dots"></div>
        </div>
        <button class="arrow-btn" id="next-btn">&#8594;</button>
        </div>

    </div>
    </div>

    <!-- スクリプト読み込み（順番が重要） -->
    <script src="cordova.js"></script>
    <script src="js/pokemon.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
